services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smolbox
      POSTGRES_USER: smolbox
      POSTGRES_PASSWORD: smolbox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smolbox -d smolbox"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://smolbox:smolbox@db:5432/smolbox
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/data/uploads

volumes:
  postgres_data:
