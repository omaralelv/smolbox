name: Backend checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SMOLBOX_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/smolbox_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smolbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smolbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test with PostgreSQL
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -q
